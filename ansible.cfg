# Pin collections to the ones bundled in this repo's venv.
#
# Without this, a user-level install in ~/.ansible/collections (e.g.
# community.general 13.0.1, which requires ansible-core >= 2.18) shadows the
# venv's bundled 3.7.0. ansible-core 2.11.5 cannot parse the newer metadata,
# and the bare-name `ufw` -> `community.general.ufw` redirect silently fails
# with "couldn't resolve module/action 'ufw'".
#
# WARNING: Ansible loads only the FIRST config file it finds (cwd ./ansible.cfg
# beats ~/.ansible.cfg beats /etc/ansible/ansible.cfg) -- it does NOT merge
# them. This file therefore completely shadows any personal ~/.ansible.cfg:
# settings you have there (host_key_checking, private_key_file, remote_user,
# etc.) are silently ignored the moment you run a playbook from this repo. If
# you rely on personal settings, copy the relevant lines into this file (e.g.
# under a new [defaults] key, or a [ssh_connection] section) rather than
# expecting ~/.ansible.cfg to apply.
#
# Path below tracks the venv's Python version (3.9, per this repo's
# venv/requirements setup). If the venv is ever rebuilt on a different Python,
# a stale path here just means this pin silently stops applying -- Ansible
# falls back to whatever collections would normally resolve (defaults +
# ANSIBLE_COLLECTIONS_PATH + user/system paths), which is the same failure
# mode this file exists to avoid, not a hard error. Update the path to match
# if that happens: venv/lib/pythonX.Y/site-packages
[defaults]
collections_paths = ./venv/lib/python3.9/site-packages
