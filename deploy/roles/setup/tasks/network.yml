- name: Computing firewall ports
  set_fact:
    _ufw_ports: "{{ ([ssh_port] + ([22] if ssh_keep_port_22 else []) + [80, 443]) | unique }}"

- name: Opening firewall ports
  become: yes
  ufw:
    rule: allow
    port: "{{ item }}"
  loop: "{{ _ufw_ports }}"

- name: Setting firewall
  become: yes
  ufw:
    state: enabled


- name: Disabling iptables
  become: yes
  command: iptables -P INPUT ACCEPT
  tags: [never, disable-iptables]

- name: Disabling iptables
  become: yes
  command: iptables -P FORWARD ACCEPT 
  tags: [never, disable-iptables]


- name: Disabling iptables
  become: yes
  command: iptables -P OUTPUT ACCEPT
  tags: [never, disable-iptables]


- name: Disabling iptables
  become: yes
  command: iptables -F
  tags: [never, disable-iptables]



- name: Resetting connection
  meta: reset_connection
