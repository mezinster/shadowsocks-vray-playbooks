# Read-only preflight. Writes ONLY under a temp directory, removed in always:.
# No task here uses notify:, and this role registers no handlers.
- name: Running the preflight
  block:
    - name: Creating a working directory for rendered artefacts
      tempfile:
        state: directory
        suffix: whatif
      register: _wi_tmp
      changed_when: false

    - name: Starting with an empty result set
      set_fact:
        whatif_results: []

    - name: Identifying the live connection
      include_tasks: connection.yml

    - name: Snapshotting guarded files before any check runs
      include_tasks: integrity_before.yml

    - name: Checking SSH lockout safety
      include_tasks: ssh_safety.yml

    - name: Running the opt-in shadow sshd authentication test
      include_tasks: shadow_sshd.yml

    - name: Checking proxy service health
      include_tasks: service_health.yml

    - name: Checking for drift between the templates and the live files
      include_tasks: drift.yml

    - name: Verifying guarded files were not modified by this preflight
      include_tasks: integrity_after.yml

    - name: Reporting
      include_tasks: report.yml

  always:
    - name: Removing the working directory
      file:
        path: "{{ _wi_tmp.path }}"
        state: absent
      when: _wi_tmp.path is defined
      changed_when: false
