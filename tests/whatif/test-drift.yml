      assert:
        that:
          - (whatif_results | selectattr('name', 'equalto', 'shadowsocks-config.j2 vs live') | map(attribute='status') | list) == ['UNKNOWN']
          - (whatif_results | selectattr('name', 'equalto', 'sentinel result must survive a drift crash') | list | length) == 1
        fail_msg: "an empty live config.json must degrade to DRIFT/UNKNOWN without crashing the play"

- name: Drift check still reports UNKNOWN when the live file is missing entirely
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    host: yourserver.domain.net
    endpoint: ss
    proxy_password: yourpassword
    method: chacha20-ietf-poly1305
    fast_open: true
    _wi_user: "{{ lookup('env', 'USER') }}"
  tasks:
    - name: Resetting state between test plays
      set_fact:
        whatif_results:
          - { group: 'PROXY', status: 'PASS', name: 'sentinel result must survive a drift crash', detail: 'seeded before drift.yml runs' }

    - name: Ensuring no live shadowsocks_config tree exists at all
      file:
        path: "/home/{{ _wi_user }}/shadowsocks_config"
        state: absent

    - name: Creating the render tempdir drift.yml expects
      tempfile:
        state: directory
        suffix: whatif-drift-test
      register: _wi_tmp

    - name: Running the real drift check with nothing deployed yet
      include_tasks: ../../deploy/roles/whatif/tasks/drift.yml

    - name: Cleaning up the tempdir
      file:
        path: "{{ _wi_tmp.path }}"
        state: absent

    - name: A missing live tree must be UNKNOWN for both files, and the sentinel result must survive
      assert:
        that:
          - (whatif_results | selectattr('group', 'equalto', 'DRIFT') | map(attribute='status') | unique | list) == ['UNKNOWN']
          - (whatif_results | selectattr('name', 'equalto', 'sentinel result must survive a drift crash') | list | length) == 1
        fail_msg: "a completely missing live deployment must degrade to DRIFT/UNKNOWN, not PASS or FAIL"

- name: Drift check survives a template render failure
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    # 'host' deliberately left undefined: both nginx-release.j2 and
    # shadowsocks-config.j2 reference {{ host }}, so rendering either one
    # raises AnsibleUndefinedVariable -- the real render-failure path, not a
    # synthetic stand-in.
    endpoint: ss
    proxy_password: yourpassword
    method: chacha20-ietf-poly1305
    fast_open: true
    _wi_user: "{{ lookup('env', 'USER') }}"
  tasks:
    - name: Resetting state between test plays
      set_fact:
        whatif_results:
          - { group: 'PROXY', status: 'PASS', name: 'sentinel result must survive a drift crash', detail: 'seeded before drift.yml runs' }

    - name: Ensuring no live shadowsocks_config tree exists
      file:
        path: "/home/{{ _wi_user }}/shadowsocks_config"
        state: absent

    - name: Creating the render tempdir drift.yml expects
      tempfile:
        state: directory
        suffix: whatif-drift-test
      register: _wi_tmp

    - name: Running the real drift check with 'host' undefined so rendering breaks
      include_tasks: ../../deploy/roles/whatif/tasks/drift.yml

    - name: Cleaning up the tempdir
      file:
        path: "{{ _wi_tmp.path }}"
        state: absent

    - name: A broken render must be UNKNOWN, and the sentinel result must survive
      assert:
        that:
          - (whatif_results | selectattr('group', 'equalto', 'DRIFT') | map(attribute='status') | unique | list) == ['UNKNOWN']
          - (whatif_results | selectattr('name', 'equalto', 'sentinel result must survive a drift crash') | list | length) == 1
        fail_msg: "a template render failure must degrade to DRIFT/UNKNOWN, not crash the play"
