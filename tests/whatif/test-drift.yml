  tasks:
    - name: Resetting state between test plays
      set_fact:
        whatif_results:
          - { group: 'PROXY', status: 'PASS', name: 'sentinel result must survive a drift crash', detail: 'seeded before drift.yml runs' }

    - name: Creating a fake live shadowsocks_config tree
      file:
        path: "/home/{{ _wi_user }}/shadowsocks_config/docker/{{ item }}"
